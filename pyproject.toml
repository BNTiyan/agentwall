[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwall"
version = "1.0.0"
description = "Zero-Config Security Firewall & Blast-Radius Shield for AI Coding Agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "BNTiyan", email = "NBR5MTR29@users.noreply.github.com" }
]
keywords = [
    "ai-agent-security",
    "firewall",
    "coding-agents",
    "sandbox",
    "guardrails",
    "blast-radius",
    "claude-code",
    "cursor"
]
dependencies = [
    "rich>=13.0.0"
]

[project.scripts]
agentwall = "agentwall.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentwall*"]
